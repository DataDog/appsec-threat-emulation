services:
  agent:
    image: datadog/agent:latest
    ports:
      - "8126:8126"
    environment:
      - DD_APM_ENABLED=true
      - DD_APM_NON_LOCAL_TRAFFIC=true
      - DD_API_KEY=${DD_API_KEY}
      - DD_SITE=${DD_SITE:-datadoghq.com}
      - DD_ENV=threat-emulation-local
      # Rootless podman/docker-in-a-VM can't auto-detect a hostname
      # (no access to /host/proc or the container socket), which makes the
      # core agent exit on startup and report "unhealthy". Pin it explicitly.
      - DD_HOSTNAME=threat-emulation-local

  juiceshop:
    image: ghcr.io/datadog/juice-shop
    volumes:
      # Preload that tags inbound request spans with bot/scraper giveaway signals.
      - ./tracing:/dd-tracing:ro
    environment:
      - DD_AGENT_HOST=agent
      - DD_TRACE_AGENT_PORT=8126
      - DD_TRACER_ENABLED=true
      - DD_APPSEC_ENABLED=true
      - DD_ENV=threat-emulation-local
      - DD_SERVICE=${DD_SERVICE:-appsec-threat-emulation}
      - DD_TRACE_DEBUG=true
      # Surface the real client IP (from X-Forwarded-For) on spans for detection.
      - DD_TRACE_CLIENT_IP_ENABLED=true
      # Inject the bot-signal span tagger into the app process.
      - NODE_OPTIONS=--require /dd-tracing/bot-signals.js
    depends_on:
      db:
        condition: service_healthy
      agent:
        condition: service_healthy
    ports:
       - 8081:3000
  db:
    image: mysql:8.0
    platform: linux/amd64
    # NOTE: use of "mysql_native_password" is not recommended: https://dev.mysql.com/doc/refman/8.0/en/upgrading-from-previous-series.html#upgrade-caching-sha2-password
    # (this is just an example, not intended to be a production configuration)
    command: --default-authentication-plugin=mysql_native_password
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: wingsuit
      MYSQL_DATABASE: juiceshop
      MYSQL_USER: juiceshop
      MYSQL_PASSWORD: juiceshop-pwd
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      timeout: 2s
      retries: 10
  cli:
    build:
      context: cli
      dockerfile: Dockerfile
    tty: true
    container_name: appsec-threat-emulation
networks:
  default:
    name: appsec-threat-emulation-network